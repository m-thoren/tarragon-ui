<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="../../../../dist/tarragon-ui.css" />
	</head>
	<body>
		<main class="container prose">
			<h1>File Input</h1>
			<div class="form-group">
				<label for="input-file">File</label>
				<input type="file" id="input-file" />
			</div>
			<div class="form-group">
				<label for="input-file-outline">File (Outline)</label>
				<input type="file" id="input-file-outline" class="outline" />
			</div>
			<div class="form-group">
				<label for="input-file-warning">File (Warning)</label>
				<input type="file" id="input-file-warning" class="warning" />
			</div>
		</main>
	</body>
</html>

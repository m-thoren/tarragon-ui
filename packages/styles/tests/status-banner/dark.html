<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="../../dist/tarragon-ui.css" />
	</head>
	<body>
		<main class="container prose">
			<h1>Status Banner</h1>
			<div class="status-banner">
				<div class="status-banner-content">
					<h2>Default info status banner</h2>
				</div>
			</div>

			<div class="status-banner success">
				<div class="status-banner-content">
					<h2>Success! Your changes have been saved</h2>
				</div>
			</div>

			<div class="status-banner warning">
				<div class="status-banner-content">
					<h2>This status banner is a warning</h2>
				</div>
			</div>

			<div class="status-banner danger">
				<div class="status-banner-content">
					<h2>An error occurred</h2>
				</div>
			</div>
		</main>
	</body>
</html>

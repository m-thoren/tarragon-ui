<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="../../dist/tarragon-ui.css" />
	</head>
	<body>
		<main class="container prose">
			<h1>Drawer</h1>
			<dialog class="drawer" open>
				<div class="split">
					<h2>Hello!</h2>
					<form method="dialog">
						<button class="ghost size-icon">
							<XIcon aria-hidden="true" />
							<span class="visually-hidden">Close drawer</span>
						</button>
					</form>
				</div>
				<p class="py-4">Press ESC key or click the button below to close</p>
				<div class="action-footer">
					<form method="dialog">
						<button class="outline">Close</button>
					</form>
				</div>
			</dialog>
		</main>
	</body>
</html>

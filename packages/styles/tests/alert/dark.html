<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="../../dist/tarragon-ui.css" />
	</head>
	<body>
		<main class="container">
			<h1>Alert</h1>
			<div class="alert">
				<h2>Default info alert</h2>
			</div>

			<div class="alert success">
				<h2>Success! Your changes have been saved</h2>
			</div>

			<div class="alert warning">
				<h2>This Alert is a warning</h2>
			</div>

			<div class="alert danger">
				<h2>An error occurred</h2>
			</div>
		</main>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="stylesheet" type="text/css" href="../../dist/tarragon-ui.css" />
	</head>
	<body>
		<main class="container prose">
			<h1>AJAX Form</h1>
			<form data-ajax action="#" method="post">
				<div class="form-group">
					<label for="input-username">
						Username
						<span class="font-medium">(required)</span>
					</label>
					<input type="text" name="username" id="input-username" required />
				</div>
				<button type="submit">Send</button>
			</form>
		</main>
	</body>
</html>
